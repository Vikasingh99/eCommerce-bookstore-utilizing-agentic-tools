openapi: 3.1.0
info:
  title: Bookstore Backend API
  version: 1.0.0
  description: |
    Simple E-Commerce Bookstore Backend REST API.

    ## Authentication Flow
    1. Register or Login to receive an `accessToken` and `refreshToken`.
    2. Pass the `accessToken` as `Authorization: Bearer <token>` on protected endpoints.
    3. When the access token expires, call `POST /api/auth/refresh` with your `refreshToken` to get a new pair.

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Error ──────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Descriptive error message
      required: [error, message]

    # ── Auth ───────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          minLength: 6
          example: secret123
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          example: secret123
      required: [email, password]

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required: [accessToken, refreshToken]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane@example.com

    # ── Product ────────────────────────────────────────────────────────────────
    ProductSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Atomic Habits
        price:
          type: number
          example: 499
        imageUrl:
          type: string
          example: /images/atomic-habits.jpg

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Atomic Habits
        author:
          type: string
          example: James Clear
        category:
          type: string
          example: Self Help
        genre:
          type: string
          example: Self Development
        description:
          type: string
          example: An easy and proven way to build good habits.
        price:
          type: number
          example: 499
        stock:
          type: integer
          example: 50
        publishedBy:
          type: string
          example: Penguin Random House
        language:
          type: string
          example: English
        imageUrl:
          type: string
          example: /images/atomic-habits.jpg
        rating:
          type: number
          example: 4.8
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Wishlist ───────────────────────────────────────────────────────────────
    WishlistItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        productId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        product:
          $ref: '#/components/schemas/ProductSummary'

    # ── Cart ───────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        productId:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        product:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            author:
              type: string
            price:
              type: number
            imageUrl:
              type: string
            stock:
              type: integer

    Cart:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        cartItems:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    # ── Order ──────────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        productId:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        price:
          type: number
          description: Price at the time of purchase
          example: 499
        product:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            author:
              type: string
            imageUrl:
              type: string

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 101
        userId:
          type: integer
          example: 1
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
          example: PENDING
        totalAmount:
          type: number
          example: 998
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    # ── Payment ────────────────────────────────────────────────────────────────
    PaymentRequest:
      type: object
      properties:
        orderId:
          type: integer
          example: 101
        paymentMethod:
          type: string
          enum: [CARD, UPI, NET_BANKING]
          example: CARD
      required: [orderId, paymentMethod]

    PaymentConfirmation:
      type: object
      properties:
        message:
          type: string
          example: Purchase confirmed successfully
        orderId:
          type: integer
          example: 101
        paymentReference:
          type: string
          example: PAY-101001
        paymentStatus:
          type: string
          enum: [SUCCESS]
          example: SUCCESS
        orderStatus:
          type: string
          enum: [CONFIRMED]
          example: CONFIRMED
        paymentId:
          type: integer
          example: 1
        amount:
          type: number
          example: 998
        paymentMethod:
          type: string
          enum: [CARD, UPI, NET_BANKING]
          example: CARD

paths:
  # ── Health ─────────────────────────────────────────────────────────────────
  /api/health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Server is running

  # ── Authentication ─────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful
                  user:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Login and receive tokens
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Expired or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Home ───────────────────────────────────────────────────────────────────
  /api/home:
    get:
      summary: Public home — lightweight product list
      description: Publicly accessible. Returns a summary list of products ordered by rating.
      tags: [Home]
      responses:
        '200':
          description: Product summary list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'

  # ── Products ───────────────────────────────────────────────────────────────
  /api/products:
    get:
      summary: Catalogue — full product list with optional search and filtering
      description: Requires authentication.
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search by title, author, genre, or category
          required: false
          schema:
            type: string
            example: habits
        - name: category
          in: query
          description: Filter by category (case-insensitive)
          required: false
          schema:
            type: string
            example: Self Help
      responses:
        '200':
          description: Filtered product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}:
    get:
      summary: Product details
      description: Requires authentication.
      tags: [Products]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Wishlist ───────────────────────────────────────────────────────────────
  /api/wishlist:
    get:
      summary: Get the authenticated user's wishlist
      tags: [Wishlist]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wishlist items
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlist:
                    type: array
                    items:
                      $ref: '#/components/schemas/WishlistItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wishlist/items:
    post:
      summary: Add a product to the wishlist
      tags: [Wishlist]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                  example: 1
              required: [productId]
      responses:
        '201':
          description: Added to wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Added to wishlist
                  item:
                    $ref: '#/components/schemas/WishlistItem'
        '400':
          description: Already in wishlist or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wishlist/items/{productId}:
    delete:
      summary: Remove a product from the wishlist
      tags: [Wishlist]
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Removed from wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Removed from wishlist
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found in wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Cart ───────────────────────────────────────────────────────────────────
  /api/cart:
    get:
      summary: Get the authenticated user's cart
      tags: [Cart]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart with items
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart:
                    $ref: '#/components/schemas/Cart'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart/items:
    post:
      summary: Add a product to the cart
      tags: [Cart]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  minimum: 1
                  example: 2
              required: [productId, quantity]
      responses:
        '201':
          description: Added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Added to cart
                  item:
                    $ref: '#/components/schemas/CartItem'
        '400':
          description: Insufficient stock or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cart/items/{productId}:
    put:
      summary: Update cart item quantity
      tags: [Cart]
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  example: 3
              required: [quantity]
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cart updated
                  item:
                    $ref: '#/components/schemas/CartItem'
        '400':
          description: Insufficient stock or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a product from the cart
      tags: [Cart]
      security:
        - BearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Removed from cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Removed from cart
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Orders ─────────────────────────────────────────────────────────────────
  /api/orders:
    post:
      summary: Create an order from the authenticated user's cart
      description: |
        Requires authentication. The server retrieves the user's cart,
        validates stock, calculates the total server-side, creates the order,
        reduces product stock, and clears the cart. All operations run in a
        Prisma transaction.
      tags: [Orders]
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order created successfully
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Cart is empty, insufficient stock, or cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}:
    get:
      summary: Get an order by ID
      description: Requires authentication. Users can only retrieve their own orders.
      tags: [Orders]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Order belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Payments ───────────────────────────────────────────────────────────────
  /api/payments:
    post:
      summary: Process a fake payment for an order
      description: |
        Requires authentication. Simulates payment — no real payment gateway is used.
        The payment amount is always taken from the server-side order record.
        Only PENDING orders can be paid. Duplicate payments are rejected.
      tags: [Payments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment successful and order confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmation'
        '400':
          description: Invalid input, order not eligible, or already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Order belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
